name: Auto-update README on merge to main

on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  update-readme:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            A PR was just merged into main. Review the changes introduced by this PR
            (use `git diff HEAD~1 HEAD` to see what changed) and update README.md
            if needed, following the rules in CLAUDE.md under "README Update Rules".

            Only modify README.md if something observable changed (new files, new scripts,
            changed metrics, new config params, changed run steps). If no README update
            is needed, do nothing.

            If you make changes, commit them with: git add README.md && git commit -m "docs: auto-update README"
