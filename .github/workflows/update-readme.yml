name: Auto-update README on merge to main

on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  update-readme:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update README with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the recent changes merged into main and update README.md
            to reflect any new features, changed APIs, or updated setup steps.
            Commit the changes with the message "docs: auto-update README".
